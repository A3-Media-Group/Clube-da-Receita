# Publica o site na Hostinger por FTP a cada atualização da branch main.
# Configure em Settings → Secrets and variables → Actions:
#   FTP_SERVER   — servidor FTP (hPanel → Arquivos → Contas FTP), ex.: ftp.clubedareceita.com.br
#   FTP_USERNAME — usuário FTP
#   FTP_PASSWORD — senha FTP
# Opcional (aba Variables): FTP_SERVER_DIR — pasta do site no FTP; padrão "public_html/".
name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o <lastmod> do sitemap vem do último commit de cada página

      - name: Conferir links internos e gerar sitemap.xml
        run: |
          node scripts/check-links.cjs
          node scripts/build-sitemap.cjs

      - name: Verificar credenciais
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Cadastre os secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            node_modules/**
            *.md
            MANIFESTO.json
            package.json
            package-lock.json
            site-config.json
